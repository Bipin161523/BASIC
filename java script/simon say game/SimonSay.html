<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Say game</title>
  <link rel="stylesheet" href="SimonSay.css">
</head>
<body>
  <h1>Hi SimonSay</h1>
  <h2>Press Any Key to Start</h2>
  <div class="btn-container">
    <div class="line-one">
      <div class="box red" type="button">1</div>
      <div class="box yellow"type="button">2</div>
    </div>
    <div class="line-two">
      <div class="box green"type="button">3</div>
      <div class="box purple"type="button">4</div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
